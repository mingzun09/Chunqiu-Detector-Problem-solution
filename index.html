      var renderSeq = 0;
      var navInput = null;
      var navPanel = null;
      var sideInput = null;
      var sidePanel = null;

      function lang() {
        var m = /answer_(zh|en|ru|es|ja)/.exec(window.location.hash || '');
        return m ? m[1] : 'zh';
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function plain(s) {
        return String(s)
          .replace(/<[^>]*>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
          .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
          .replace(/&nbsp;/g, ' ')
          .replace(/&amp;/g, '&')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/\s+/g, ' ')
          .trim();
      }

      function parseIndex(md) {
        var items = [];
        var section = '';
        var entryIndex = 0;
        var headIndex = 0;
        var inFence = false;
        var lines = md.split(/\r?\n/);

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();

          if (/^(```|~~~)/.test(line)) { inFence = !inFence; continue; }
          if (inFence || !line) continue;

          var h = line.match(/^(#{1,6})\s+(.+?)\s*#*$/);
          if (h) {
            var level = h[1].length;
            var heading = plain(h[2]);
            /* 只有一级/二级标题算「分类」；条目内部的 ### 小标题属于解释正文，不建索引 */
            if (level <= 2) section = heading;
            if (level === 2 && heading && !/^(目录|table of contents|检测项正文)$/i.test(heading)) {
              items.push({ kind: 'heading', title: heading, section: heading, index: headIndex++ });
            }
            continue;
          }

          var re = /<summary\b[^>]*>([\s\S]*?)<\/summary>/gi;
          var m;
          while ((m = re.exec(line)) !== null) {
            var title = plain(m[1]);
            if (title) items.push({ kind: 'entry', title: title, section: section, index: entryIndex++ });
          }
        }
        return items;
      }

      function loadIndex(l) {
        if (cache[l]) return Promise.resolve(cache[l]);
        if (pending[l]) return pending[l];
        pending[l] = fetch(DOCS[l].path, { cache: 'no-cache' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function (md) {
            cache[l] = parseIndex(md);
            return cache[l];
          })
          .catch(function (err) {
            console.warn('[entry-search] 索引加载失败 / index failed:', err);
            cache[l] = [];
            return cache[l];
          });
        return pending[l];
      }

      /* 只比对标题：多关键词用空格分隔，全部命中才算匹配 */
      function search(items, query) {
        var q = plain(query).toLowerCase();
        if (!q) return [];
        var tokens = q.split(/\s+/).filter(Boolean);
        var hits = [];

        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          var title = item.title.toLowerCase();
          var matched = true;
          for (var j = 0; j < tokens.length; j++) {
            if (title.indexOf(tokens[j]) === -1) { matched = false; break; }
          }
          if (!matched) continue;
          var score = title === q ? 0 : (title.indexOf(q) === 0 ? 1 : (title.indexOf(q) > 0 ? 2 : 3));
          hits.push({ item: item, score: score });
        }

        hits.sort(function (a, b) {
          if (a.score !== b.score) return a.score - b.score;
          if (a.item.kind !== b.item.kind) return a.item.kind === 'entry' ? -1 : 1;
          if (a.item.title.length !== b.item.title.length) return a.item.title.length - b.item.title.length;
          return a.item.title.localeCompare(b.item.title);
        });

        return hits.slice(0, MAX_RESULTS).map(function (hit) { return hit.item; });
      }

      function highlight(title, query) {
        var tokens = plain(query).toLowerCase().split(/\s+/).filter(Boolean);
        var lower = title.toLowerCase();
        var ranges = [];

        tokens.forEach(function (token) {
          var from = 0;
          while (from <= lower.length) {
            var at = lower.indexOf(token, from);
            if (at === -1) break;
            ranges.push([at, at + token.length]);
            from = at + token.length;
          }
        });
        if (!ranges.length) return escapeHtml(title);

        ranges.sort(function (a, b) { return a[0] - b[0] || b[1] - a[1]; });
        var merged = [];
        ranges.forEach(function (range) {
          var prev = merged[merged.length - 1];
          if (prev && range[0] <= prev[1]) prev[1] = Math.max(prev[1], range[1]);
          else merged.push([range[0], range[1]]);
        });

        var html = '';
        var pos = 0;
        merged.forEach(function (range) {
          html += escapeHtml(title.slice(pos, range[0]));
          html += '<span class="search-keyword">' + escapeHtml(title.slice(range[0], range[1])) + '</span>';
          pos = range[1];
        });
        html += escapeHtml(title.slice(pos));
        return html;
      }

      function renderResults(results, query, l) {
        if (!results.length) {
          return '<div class="no-results">' + escapeHtml(DOCS[l].empty) + '</div>';
        }
        return results.map(function (item) {
          var attr = item.kind === 'entry'
            ? 'data-entry="' + item.index + '"'
            : 'data-head="' + item.index + '"';
          var label = item.kind === 'entry'
            ? (item.section || DOCS[l].entry)
            : SECTION_LABEL[l];
          return '<a class="matching-post" href="javascript:void(0)" ' + attr +
            ' data-title="' + escapeHtml(item.title) + '">' +
            '<h2>' + highlight(item.title, query) + '</h2>' +
            '<p>' + escapeHtml(label) + '</p>' +
            '</a>';
        }).join('');
      }

      function hidePanels() {
        var nav = document.querySelector('.nav-search-dropdown');
        var side = document.querySelector('.sidebar .results-panel');
        if (nav) nav.classList.remove('show');
        if (side) side.classList.remove('show');
      }

      function apply(query) {
        lastQuery = query;
        var l = lang();
        var seq = ++renderSeq;

        if (!query.trim()) {
          hidePanels();
          return;
        }

        loadIndex(l).then(function (items) {
          if (seq !== renderSeq) return;
          var results = search(items, query);
          var html = renderResults(results, query, l);

          var nav = document.querySelector('.nav-search-dropdown');
          var side = document.querySelector('.sidebar .results-panel');
          if (nav) { nav.innerHTML = html; nav.classList.add('show'); }
          if (side) { side.innerHTML = html; side.classList.add('show'); }
        });
      }

      function summaryText(details) {
        var summary = details.querySelector('summary');
        return summary ? plain(summary.textContent) : '';
      }

      function normText(s) {
        return plain(String(s || '')).replace(/[\s\u3000]+/g, '').toLowerCase();
      }

      function reveal(el) {
        if (!el) return;
        if (el.tagName === 'DETAILS') el.open = true;
        var box = el.closest ? el.closest('details') : null;
        if (box) box.open = true;
        var top = el.getBoundingClientRect().top + window.pageYOffset - 14;
        window.scrollTo({ top: top < 0 ? 0 : top, behavior: 'smooth' });
        el.classList.remove('search-highlight');
        void el.offsetWidth;
        el.classList.add('search-highlight');
        window.setTimeout(function () { el.classList.remove('search-highlight'); }, 2400);
      }

      function findEntry(index, title) {
        var list = Array.prototype.slice.call(document.querySelectorAll('.markdown-section details'));
        var want = normText(title);
        for (var i = 0; i < list.length; i++) {
          if (normText(summaryText(list[i])) === want) return list[i];
        }
        /* 文本没对上时退回按下标（仅在条目数与索引一致时有效） */
        return list[index] || null;
      }

      function openEntry(index, title, attempt) {
        attempt = attempt || 0;
        var target = findEntry(index, title);
        if (target) { reveal(target); return; }

        if (attempt === 0) {
          /* 不在当前文档（例如停留在致谢页）：先跳到词条所属文档 */
          window.location.hash = '#/' + DOCS[lang()].path;
          window.setTimeout(function () { openEntry(index, title, 1); }, 700);
          return;
        }
        if (attempt < 8) {
          window.setTimeout(function () { openEntry(index, title, attempt + 1); }, 450);
        }
      }

      function openHeading(index, title) {
        var heads = Array.prototype.slice.call(document.querySelectorAll('.markdown-section h2'));
        var want = normText(title);
        var target = null;
        for (var i = 0; i < heads.length; i++) {
          if (normText(heads[i].textContent) === want) { target = heads[i]; break; }
        }
        if (!target) target = heads[index] || null;
        if (target) reveal(target);
      }

      function bindInput(input) {
        input.addEventListener('input', function () {
          var value = input.value;
          if (navInput && navInput !== input) navInput.value = value;
          if (sideInput && sideInput !== input) sideInput.value = value;
          apply(value);
        });

        input.addEventListener('focus', function () {
          if (input.value.trim()) apply(input.value);
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            var panel = (input === sideInput)
              ? document.querySelector('.sidebar .results-panel')
              : document.querySelector('.nav-search-dropdown');
            var first = panel && panel.querySelector('.matching-post');
            if (first) first.click();
          } else if (e.key === 'Escape') {
            hidePanels();
            input.blur();
          }
        });
      }

      function ensureNavSearch() {
        var navUl = document.querySelector('.app-nav ul');
        if (!navUl) return;

        var li = navUl.querySelector('.nav-search-item');
        if (!li) {
          li = document.createElement('li');
          li.className = 'nav-search-item';

          navInput = document.createElement('input');
          navInput.type = 'search';
          navInput.className = 'nav-search-input';
          navInput.setAttribute('aria-label', 'Search entries');

          navPanel = document.createElement('div');
          navPanel.className = 'nav-search-dropdown';

          li.appendChild(navInput);
          li.appendChild(navPanel);
          bindInput(navInput);
        } else {
          navInput = li.querySelector('.nav-search-input');
          navPanel = li.querySelector('.nav-search-dropdown');
        }

        if (navUl.firstChild !== li) navUl.insertBefore(li, navUl.firstChild);
        if (navInput) navInput.placeholder = DOCS[lang()].placeholder;
      }

      function ensureSidebarSearch() {
        var sidebar = document.querySelector('.sidebar');
        if (!sidebar) return;

        var wrap = sidebar.querySelector('.search');
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.className = 'search';

          sideInput = document.createElement('input');
          sideInput.type = 'search';
          sideInput.className = 'search-input';
          sideInput.setAttribute('aria-label', 'Search entries');

          sidePanel = document.createElement('div');
          sidePanel.className = 'results-panel';

          wrap.appendChild(sideInput);
          wrap.appendChild(sidePanel);

          var sidebarNav = sidebar.querySelector('.sidebar-nav');
          if (sidebarNav) sidebar.insertBefore(wrap, sidebarNav);
          else sidebar.appendChild(wrap);

          bindInput(sideInput);
        } else {
          sideInput = wrap.querySelector('input');
          sidePanel = wrap.querySelector('.results-panel');
        }

        if (sideInput) sideInput.placeholder = DOCS[lang()].placeholder;
      }

      /* 点击结果：只展开被点击的那一个词条 */
      document.addEventListener('click', function (e) {
        var hit = e.target.closest('.matching-post[data-entry], .matching-post[data-head]');
        if (hit) {
          e.preventDefault();
          var title = hit.getAttribute('data-title') || '';
          hidePanels();
          if (hit.hasAttribute('data-entry')) {
            openEntry(parseInt(hit.getAttribute('data-entry'), 10), title);
          } else {
            openHeading(parseInt(hit.getAttribute('data-head'), 10), title);
          }
          return;
        }

        var navWrap = document.querySelector('.nav-search-item');
        if (navWrap && !navWrap.contains(e.target)) {
          var nav = document.querySelector('.nav-search-dropdown');
          if (nav) nav.classList.remove('show');
        }
        var sideWrap = document.querySelector('.sidebar .search');
        if (sideWrap && !sideWrap.contains(e.target)) {
          var side = document.querySelector('.sidebar .results-panel');
          if (side) side.classList.remove('show');
        }
      }, true);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hidePanels();
      });

      /* 路由切换：清空查询，重新挂载搜索框 */
      window.$docsify = window.$docsify || {};
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(function (hook) {
        hook.doneEach(function () {
          lastQuery = '';
          renderSeq++;
          if (navInput) navInput.value = '';
          if (sideInput) sideInput.value = '';
          hidePanels();
          ensureNavSearch();
          ensureSidebarSearch();
          loadIndex(lang());
        });
      });

      /* 导航栏会随路由重建，定期确保搜索框存在 */
      window.setInterval(function () {
        ensureNavSearch();
        ensureSidebarSearch();
      }, 400);
    })();
  </script>
  <!-- ============================================================
       UX 增强 / UX enhancements
       1) 统一 docsify 的「标题 id」与「目录链接 slug」两套算法

        border-left-color: var(--dk-accent);
      }

      .matching-post.ux-active h2 {
        color: var(--dk-accent);
      }
    }
  </style>

  <script id="ux-script">
    (function () {
      'use strict';

      var CJK = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\u3040-\u30ff]/;

      /* 与 docsify 生成目录链接 slug 时相同的规则：去标签 → 只留字母/数字/-/_/CJK
         → 空白转 '-' → 连续 '-' 合并。用它统一标题 id，使目录/侧栏链接能够命中。 */
      function linkSlug(text) {
        var s = String(text || '').replace(/<[^>]*>/g, '');
        var out = '';
        for (var i = 0; i < s.length; i++) {
          var ch = s.charAt(i);
          if (ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r') out += '-';
          else if (/[0-9a-zA-Z\-_]/.test(ch) || CJK.test(ch)) out += ch.toLowerCase();
        }
        return out.replace(/-+/g, '-').replace(/^-|-$/g, '');
      }

      function textOf(el) {
        return (el.textContent || '').replace(/\s+/g, ' ').trim();
      }

      function uniqueId(base, used) {
        var id = base, n = 0;
        while (used[id]) {
          n += 1;
          id = base + '-' + n;
        }
        used[id] = true;
        return id;
      }

      /* 1) 标题 id 统一成链接 slug 规则 */
      function syncHeadingIds() {
        var used = {};
        var heads = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6');
        for (var i = 0; i < heads.length; i++) {
          var h = heads[i];
          var base = linkSlug(textOf(h));
          if (!base) continue;
          var id = uniqueId(base, used);
          if (h.id !== id) h.id = id;
          var anchor = h.querySelector('a.anchor');
          if (anchor) {
            anchor.setAttribute('data-id', id);
            anchor.setAttribute('href', '#/?id=' + encodeURIComponent(id));
          }
        }
      }

      /* 2) 目录 / 侧栏里的锚点链接按标题文本重新指向，绕开 docsify 自带的编号偏差 */
      function syncAnchorLinks() {
        var links = document.querySelectorAll('.markdown-section a[href*="?id="], .sidebar a[href*="?id="]');
        var byText = {};
        var heads = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6');
        for (var i = 0; i < heads.length; i++) {
          var key = linkSlug(textOf(heads[i]));
          if (key && !byText[key]) byText[key] = heads[i].id;
        }
        for (var j = 0; j < links.length; j++) {
          var a = links[j];
          var label = a.getAttribute('title') || textOf(a);
          var slug = linkSlug(label);
          var target = byText[slug];
          if (!target) continue;
          a.setAttribute('href', '#/?id=' + encodeURIComponent(target));
        }
      }

      /* 3) 每个条目给一个稳定 id，便于深链与搜索定位 */
      function tagEntries() {
        var list = document.querySelectorAll('.markdown-section details');
        for (var i = 0; i < list.length; i++) {
          var d = list[i];
          if (!d.id) d.id = 'entry-' + (i + 1);
          var s = d.querySelector('summary');
          if (s && !s.getAttribute('data-target')) s.setAttribute('data-target', d.id);
        }
      }

      /* 4) 表格套滚动容器 */
      function wrapTables() {
        var tables = document.querySelectorAll('.markdown-section table');
        for (var i = 0; i < tables.length; i++) {
          var t = tables[i];
          if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('md-table-wrap')) continue;
          var wrap = document.createElement('div');
          wrap.className = 'md-table-wrap';
          t.parentNode.insertBefore(wrap, t);
          wrap.appendChild(t);
        }
      }

      function flash(el) {
        el.classList.remove('jump-flash');
        void el.offsetWidth;
        el.classList.add('jump-flash');
        window.setTimeout(function () { el.classList.remove('jump-flash'); }, 1900);
      }

      function openAndScroll(el) {
        if (!el) return false;
        var box = el.closest ? el.closest('details') : null;
        if (box) box.open = true;
        if (el.tagName === 'DETAILS') el.open = true;
        var top = el.getBoundingClientRect().top + window.pageYOffset - 14;
        window.scrollTo({ top: top < 0 ? 0 : top, behavior: 'smooth' });
        flash(el);
        return true;
      }

      function resolveTarget(hash) {
        if (!hash) return null;
        var raw = hash.replace(/^#\/?/, '');
        var q = raw.indexOf('?id=');
        var id = q >= 0 ? raw.slice(q + 4) : (raw.indexOf('/') === -1 ? raw : '');
        if (!id) return null;
        try { id = decodeURIComponent(id); } catch (err) { /* keep raw */ }
        var el = document.getElementById(id);
        if (el) return el;
        /* 兜底：按归一化文本找标题 */
        var heads = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4');
        for (var i = 0; i < heads.length; i++) {
          if (linkSlug(textOf(heads[i])) === linkSlug(id)) return heads[i];
        }
        return null;
      }

      /* 5) 站内锚点点击：自己滚动（带偏移），并同步 URL */
      document.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('a[href*="?id="], a[href^="#/?"]') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (href.indexOf('?id=') === -1) return;
        var target = resolveTarget(href);
        if (!target) return;
        e.preventDefault();
        e.stopPropagation();
        openAndScroll(target);
        var page = (window.location.hash || '').split('#')[1] || '';
        var path = page.indexOf('?') >= 0 ? page.slice(0, page.indexOf('?')) : page;
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search +
            '#/' + (path || '') + '?id=' + encodeURIComponent(target.id));
        } catch (err) { /* ignore */ }
      }, true);

      /* 6) 返回顶部 + 阅读进度 */
      var topBtn = null;
      var bar = null;

      function ensureChrome() {
        if (!topBtn) {
          topBtn = document.createElement('button');
          topBtn.id = 'ux-top';
          topBtn.type = 'button';
          topBtn.title = '回到顶部 / Back to top';
          topBtn.setAttribute('aria-label', 'Back to top');
          topBtn.innerHTML = '↑';
          topBtn.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          document.body.appendChild(topBtn);

          bar = document.createElement('div');
          bar.id = 'ux-progress';
          document.body.appendChild(bar);
        }
        onScroll();
      }

      function onScroll() {
        var y = window.pageYOffset || document.documentElement.scrollTop || 0;
        if (topBtn) topBtn.classList.toggle('show', y > 600);
        if (bar) {
          var h = document.documentElement.scrollHeight - window.innerHeight;
          bar.style.width = (h > 0 ? Math.min(100, (y / h) * 100) : 0) + '%';
        }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);

      /* 7) 侧栏：全部展开 / 收起 + 本页目录 + 当前章节高亮 */
      var TOC_LABEL = { zh: '本页目录', en: 'On this page', ru: 'На этой странице', es: 'En esta página', ja: 'このページの目次' };

      function currentLang() {
        var m = /answer_(zh|en|ru|es|ja)/.exec(window.location.hash || '');
        return m ? m[1] : 'zh';
      }

      function buildSideToc() {
        var sidebar = document.querySelector('.sidebar');
        var nav = sidebar && sidebar.querySelector('.sidebar-nav');
        if (!nav) return;
        var old = nav.querySelector('.ux-toc');
        if (old) old.remove();

        var heads = document.querySelectorAll('.markdown-section h2');
        if (!heads.length) return;

        var box = document.createElement('div');
        box.className = 'ux-toc';

        var title = document.createElement('p');
        title.className = 'ux-toc-title';
        title.textContent = TOC_LABEL[currentLang()] || TOC_LABEL.zh;
        box.appendChild(title);

        var ul = document.createElement('ul');
        for (var i = 0; i < heads.length; i++) {
          var h = heads[i];
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.setAttribute('href', '#/?id=' + encodeURIComponent(h.id));
          a.setAttribute('data-target', h.id);
          a.textContent = textOf(h);
          li.appendChild(a);
          ul.appendChild(li);
        }
        box.appendChild(ul);
        nav.appendChild(box);
      }
      function ensureToolbar() {
        var sidebar = document.querySelector('.sidebar');
        if (!sidebar || sidebar.querySelector('.ux-toolbar')) return;
        var bar = document.createElement('div');
        bar.className = 'ux-toolbar';
        var open = document.createElement('button');
        open.type = 'button';
        open.textContent = '展开全部';
        open.addEventListener('click', function () {
          document.querySelectorAll('.markdown-section details').forEach(function (d) { d.open = true; });
        });
        var close = document.createElement('button');
        close.type = 'button';
        close.textContent = '收起全部';
        close.addEventListener('click', function () {
          document.querySelectorAll('.markdown-section details').forEach(function (d) { d.open = false; });
        });
        bar.appendChild(open);
        bar.appendChild(close);
        var nav = sidebar.querySelector('.sidebar-nav');
        if (nav) sidebar.insertBefore(bar, nav);
        else sidebar.appendChild(bar);
      }

      var spyLinks = [];
      var spyBound = false;

      function updateSpy() {
        if (!spyLinks.length) return;
        var y = (window.pageYOffset || 0) + 90;
        var current = null;
        var heads = document.querySelectorAll('.markdown-section h2');
        for (var i = 0; i < heads.length; i++) {
          if (heads[i].getBoundingClientRect().top + window.pageYOffset <= y) current = heads[i].id;
        }
        spyLinks.forEach(function (a) { a.parentNode && a.parentNode.classList.remove('ux-current'); });
        if (!current) return;
        spyLinks.forEach(function (a) {
          if (a.getAttribute('data-target') === current ||
            (a.getAttribute('href') || '').indexOf(encodeURIComponent(current)) !== -1) {
            a.parentNode && a.parentNode.classList.add('ux-current');
          }
        });
      }

      function scrollSpy() {
        spyLinks = Array.prototype.slice.call(document.querySelectorAll('.sidebar a[href*="?id="]'));
        if (spyBound) {
          updateSpy();
          return;
        }
        spyBound = true;
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(function () { updateSpy(); ticking = false; });
        }, { passive: true });
        updateSpy();
      }

      /* 8) 任意页面渲染完成后统一处理 */
      function enhance() {
        enhance._ran = true;
        tagEntries();
        syncHeadingIds();
        syncAnchorLinks();
        wrapTables();
        ensureToolbar();
        buildSideToc();
        scrollSpy();
        ensureChrome();
        openDeepLinkedEntry();
      }

      function openDeepLinkedEntry() {
        var hash = window.location.hash || '';
        if (hash.indexOf('entry-') === -1) return;
        var target = resolveTarget(hash);
        if (target && target.tagName === 'DETAILS' && !target.open) {
          target.open = true;
          var top = target.getBoundingClientRect().top + window.pageYOffset - 14;
          window.scrollTo({ top: top < 0 ? 0 : top });
        }
      }

      /* Ctrl/Cmd+K 或 / 聚焦搜索框 */
      document.addEventListener('keydown', function (e) {
        var tag = (e.target.tagName || '').toLowerCase();
        var typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
        var slash = e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey;
        var combo = (e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey);
        if (!slash && !combo) return;
        var input = document.querySelector('.nav-search-input') || document.querySelector('.sidebar .search-input');
        if (!input) return;
        e.preventDefault();
        input.focus();
        input.select();
      });

      /* 搜索结果上下键选择 */
      document.addEventListener('keydown', function (e) {
        var tag = (e.target.tagName || '').toLowerCase();
        if (tag !== 'input') return;
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        var panel = e.target.closest('.nav-search-item') ? document.querySelector('.nav-search-dropdown')
          : document.querySelector('.sidebar .results-panel');
        if (!panel || !panel.classList.contains('show')) return;
        var items = Array.prototype.slice.call(panel.querySelectorAll('.matching-post'));
        if (!items.length) return;
        e.preventDefault();
        var at = items.findIndex(function (el) { return el.classList.contains('ux-active'); });
        at = e.key === 'ArrowDown' ? Math.min(items.length - 1, at + 1) : Math.max(0, at - 1);
        items.forEach(function (el) { el.classList.remove('ux-active'); });
        items[at].classList.add('ux-active');
        items[at].scrollIntoView({ block: 'nearest' });
      });

      window.$docsify = window.$docsify || {};
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(function (hook) {
        hook.doneEach(function () {
          window.setTimeout(enhance, 0);
        });
      });

      if (document.readyState !== 'loading') window.setTimeout(enhance, 0);
      else document.addEventListener('DOMContentLoaded', function () { window.setTimeout(enhance, 0); });
    })();
  </script>

</body>
